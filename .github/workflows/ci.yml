name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 本插件没有运行时依赖（不需要 npm install），门禁全是纯 Node。
      - name: Syntax check every published module
        run: |
          node --check index.js
          node --check client.js
          node --check scripts/check-manifest.mjs

      - name: Unit tests (colour maths)
        run: npm test

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate package.json / dsh.plugin.json / cordis.patch.yml / locale
        run: npm run check:manifest
